name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: selat
          POSTGRES_PASSWORD: selat
          POSTGRES_DB: selat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U selat"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://selat:selat@localhost:5432/selat_test
      PUBLIC_URL: http://localhost:8080
      VAULT_KEY: 11111111111111111111111111111111111111111111111111111111111111ff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A credential-shaped literal in the tree means a real one leaked or a
      # fixture is about to teach someone to commit one.
      - name: no credential literals outside the minting code
        run: |
          if grep -rInE 'slt_(live|test)_[A-Za-z0-9_-]{20,}' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "credential-shaped literal found"; exit 1
          fi
